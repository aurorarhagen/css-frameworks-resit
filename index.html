<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | LinkUp</title>
    <link href="/css/custom.css" rel="stylesheet">
</head>
<body id="bg-home-page">
<div class="px-4 py-5 bg-light position-absolute top-50 start-50 translate-middle rounded" style="width: 400px;">
  <h1 class="text-center">LinkUp</h1>
  <form class="container pt-2">
    <div class="mb-3">
      <label for="exampleInputEmail1" class="form-label">Email address</label>
      <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
    </div>
    <div class="mb-3">
      <label for="exampleInputPassword1" class="form-label">Password</label>
      <input type="password" class="form-control" id="exampleInputPassword1" required minlength="8">
      <p>Forgot your password?</p>
    </div>
    <div>
      <a href="/feed/index.html" class="d-grid gap-2 mx-auto">
    <button type="button" class="btn btn-success">Log In</button></a>
  </div>
  </form>
  <div class="text-center">
    <p>Don't have an account?</p>
    <h3>Sign up now</h3>
  </div>
</div>
</body>
</html>
